# Ant — déploiement sur la VM Debian ou le conteneur LXC (voir README.md).
# Seul le service `web` est publié ; Nginx Proxy Manager termine le HTTPS devant lui.
name: ant

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: ant
      POSTGRES_USER: ant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ant -d ant"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ant-server:local
    command: ["node", "dist/web.js"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      ANT_SERVICE: web
      DATABASE_URL: postgres://ant:${POSTGRES_PASSWORD}@postgres:5432/ant
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN manquant}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COMPUTER_URL: http://computer:7000
      COMPUTER_RPC_TOKEN: ${COMPUTER_RPC_TOKEN:?COMPUTER_RPC_TOKEN manquant}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      # Proxys autorisés à fixer l'adresse du client (X-Forwarded-For). Le défaut (réseaux privés) inclut le
      # réseau sandbox de l'ordinateur des agents : mets l'IP exacte de Nginx Proxy Manager dès la première
      # connexion. Jamais « true ». Voir README § 7.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      TZ: ${TZ:-Europe/Zurich}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${ANT_BIND_ADDRESS:-0.0.0.0}:${ANT_PORT:-8080}:8080"
    networks: [front, internal, sandbox]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *hardening
    image: ant-server:local
    command: ["node", "dist/worker.js"]
    read_only: true
    tmpfs: [/tmp, /home/node]
    environment:
      ANT_SERVICE: worker
      DATABASE_URL: postgres://ant:${POSTGRES_PASSWORD}@postgres:5432/ant
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      # Identifiants Claude : uniquement dans ce service. Voir README § « Connexion à Claude ».
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COMPUTER_URL: http://computer:7000
      COMPUTER_RPC_TOKEN: ${COMPUTER_RPC_TOKEN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      TZ: ${TZ:-Europe/Zurich}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - claude-state:/data
    networks: [internal, egress, sandbox]
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    stop_grace_period: 40s

  computer:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/computer/Dockerfile
    image: ant-computer:local
    # Racine en lecture seule : ce qu'un agent écrit hors de /workspace et du profil navigateur
    # (~/.bashrc, ~/.profile, ~/.local…) disparaît au redémarrage du conteneur.
    # exec : nécessaire aux scripts lancés depuis /tmp et aux outils installés avec pip --user.
    # /tmp/.X11-unix : dossier des sockets X appartenant à root, comme Xvfb l'attend.
    # Ces tmpfs et /dev/shm sont pris sur mem_limit : 768m + 512m + 256m au plus, sur les 3g par défaut.
    # Chromium place sa mémoire partagée dans /tmp (--disable-dev-shm-usage), d'où un /dev/shm réduit.
    # Les caches de pip et npm ne vont pas en mémoire (apps/computer/Dockerfile).
    read_only: true
    tmpfs:
      - /tmp:mode=1777,exec,size=768m
      - /tmp/.X11-unix:mode=1777,size=1m
      - /home/agent:uid=1000,gid=1000,mode=0755,exec,size=512m
    environment:
      COMPUTER_RPC_TOKEN: ${COMPUTER_RPC_TOKEN}
      TZ: ${TZ:-Europe/Zurich}
    volumes:
      - workspace:/workspace
      - browser-profile:/home/agent/.ant-browser
    networks: [sandbox]
    shm_size: 256mb
    pids_limit: 1024
    mem_limit: ${COMPUTER_MEMORY:-3g}
    cpus: ${COMPUTER_CPUS:-2}

  backup:
    <<: *hardening
    image: postgres:17-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    entrypoint: ["/bin/sh", "/backup.sh"]
    # Sauvegarde vérifiée chaque nuit, retentée toutes les 10 min (6 fois au plus) en cas d'échec.
    environment:
      PGHOST: postgres
      PGUSER: ant
      PGDATABASE: ant
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: ${TZ:-Europe/Zurich}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-/var/backups/ant}:/backups
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    # « unhealthy » dans docker compose ps : dernière tentative en échec, ou aucune sauvegarde de moins de 36 h.
    healthcheck:
      test: ["CMD", "/bin/sh", "/backup.sh", "--check"]
      interval: 5m
      timeout: 30s
      start_period: 1m
      retries: 1

volumes:
  pgdata:
  claude-state:
  workspace:
  browser-profile:

networks:
  # Publication du port web (vers Nginx Proxy Manager).
  front:
    driver_opts:
      com.docker.network.bridge.name: ant-front
  # Base de données : aucun accès extérieur.
  internal:
    internal: true
  # Sortie Internet du worker (API Anthropic).
  egress:
    driver_opts:
      com.docker.network.bridge.name: ant-egress
  # Réseau de l'ordinateur des agents : Internet oui, réseau local non (deploy/ant-firewall.sh).
  sandbox:
    driver_opts:
      com.docker.network.bridge.name: ant-sandbox
